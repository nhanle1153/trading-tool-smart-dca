# tool_d_config.yaml — nguồn sự thật duy nhất, commit vào git
# Chép nguyên §6.9.5 của tool-d-smart-dca.md (v8, dòng 2311-2395), TD-0013.
#
# 🔴 v6 (spec): ĐÂY là nguồn sự thật cho danh sách tham số. DR-010 KHÔNG
#        lặp lại danh sách — nó chỉ ghi LÝ DO. Danh sách xuất hiện ở hai
#        nơi chính là cơ chế đã gây ra toàn bộ đợt lệch số của v5.
# Sửa file này = tạo một commit = có dấu vết.
#
# 🔴 Không dùng *Parameter của Freqtrade cho BẤT KỲ khoá nào ở file này
#    (§0d.2, L-Z37). Đọc YAML -> dict -> truyền vào hàm. Đọc qua
#    src/tool_d/config/loader.py, không đọc trực tiếp ở nơi khác.
#
# ✅ Tầng A (E_D, L_exchange, rho_pct, daily_loss_budget_pct) ĐÃ CHỐT bằng
#    DR-D0PRE-06 (TD-0043, 06/09/2026) — trùng giá trị minh hoạ của spec
#    nhưng giờ là quyết định của chủ dự án, không còn là ví dụ.
# ✅ Tầng C dd_ladder_pct (5/8/20%) ĐÃ CHỐT bằng DR-D0PRE-04 (TD-0042) — Hạng 0.

tier_a: # chỉnh tự do, 0 trial
  E_D: 500 # USDT — KHÔNG phải số dư ví. ✅ DR-D0PRE-06 (TD-0043)
  L_exchange: 3 # 2-5, xem §6.9.2 cảnh báo. ✅ DR-D0PRE-06
  rho_pct: 0.375 # chỉ đổi khi danh mục RỖNG. ✅ DR-D0PRE-06
  daily_loss_budget_pct: 8.0 # ✅ DR-D0PRE-06 — đi cặp với dd_ladder.halt (§12c.5)
  enable_long: true
  enable_short: false # chỉ bật khi DG7 (§4c) xong
  pool_size_target: 100

  _derived: # HỆ THỐNG TÍNH, không nhập tay
    max_open_positions: null # ← §6.8f, DAO ĐỘNG theo zone width
    margin_used_pct: null # ← Σ margin / E_D, trần 0.85
    risk_used_pct: null # ← Σ rủi ro / E_D, trần daily_loss
    l_total_d: null # ← Σ N_full / E_D, ĐO ĐƯỢC
  # ❌ L_D_max      — v6 XOÁ (≡ 0.85 × L_exchange, §6.8c)
  # ❌ max_open_D   — v4 XOÁ (là KẾT QUẢ của §6.8f, không phải tham số)

tier_b: # MỖI LẦN ĐỔI = 1 TRIAL từ B3. 12 mục
  # 🆕 MT-03 (back-end-note.md mục 7): registry là nguồn sự thật cho ngân
  # sách B3, KHÔNG PHẢI khoá này. Spec gốc để "20" và ghi chú "hệ thống
  # giảm, không sửa tay" — nhưng hai nguồn sự thật cho cùng một số chính
  # là cơ chế đã gây lệch số của v5 (spec tự cảnh báo, dòng 3315-3317).
  # loader.py RAISE nếu khoá này khác null.
  _budget_remaining_B3: null # derived — xem registry/trial_registry.jsonl (MT-03)
  zss_threshold: 0.5 #  1  §1.3
  buf_sl_atr: 0.4 #  2  §3.1
  wick_close_upper_frac: 0.5 #  3  §3.3b
  v_min: null #  4  §3.3b   [CẦN CALIBRATE — OQ-06, trạng thái TUNED_PENDING]
  funding_rate_pct: -0.05 #  5  §3.3d + DG6-D (gộp)
  dg6d_retrace_frac: 0.5 #  6  §3.3d
  dg4_bars_1h: 8 #  7  §4
  dg6a_atr_ratio: 1.8 #  8  §4.1
  tp1_haircut_pct: 20 #  9  §5.1
  mult_corr_thresholds: [0.60, 0.85] # 10  §6.2 hệ số 3
  max_hold_bars_4h: 24 # 11  §4b.3
  dg7_funding_frac: 0.3 # 12  §4c   🆕 v6 — v5 chưa đếm
  # 🔴 zone_width_min_atr KHÔNG có ở đây — DR-D0PRE-01 (TD-0030) kết luận
  # CHẾT (zone_width_pct == 0.6×ATR/price theo cấu trúc §1.1, LUÔN ≥ ngưỡng
  # lọc 0.5×ATR/price — một hằng đẳng thức, không phải điều kiện phụ thuộc
  # dữ liệu). Xoá hẳn, không để lại dạng comment (spec dòng 1070: "comment
  # còn đó là lời mời bật lại mà không qua DR"). N_ĐĂNG_KÝ = 114.

tier_frozen: # 🔒 MỞ KHOÁ = +6 vào N (§12c.3)
  _unfreeze_count: 0
  # 🔴 v6 (spec): `dof` = số BẬC TỰ DO khoá này loại bỏ khỏi kiểm kê gốc.
  #        KHÁC với số khoá. Đây chính là chỗ v5 đếm sai (khai "đóng
  #        băng 9 tham số" trong khi 2 trong số đó chưa từng được đếm).
  w_zss: { value: [0.3333, 0.3333, 0.3334], dof: -2 } # §1.2
  w_tranche: { value: [0.3333, 0.3333, 0.3334], dof: 0 } # §3.1 🆕
  adx_threshold: { value: 20, dof: 0 } # chưa từng có trong 26
  mult_regime: { value: { strong: 1.0, weak: 0.7, adx_split: 25 }, dof: -1 }
  tp2_trail_atr: { value: 1.5, dof: -1 }
  dg6b_bars_1h: { value: 8, dof: -1 } # = dg4_bars_1h
  trend_age_days: { value: 5, dof: -1, frozen_until: "Z0-T1_result" }
  mult_edge_thr: { value: 0.5, dof: 0 } # §6.2 hệ số 5 🆕
  mult_deploy_thr: { value: 0.85, dof: 0 } # §6.2 hệ số 6 🆕
  diag_thresholds:
    {
      value:
        {
          time_stop_band: [0.05, 0.25],
          tp_fallback_max_frac: 0.40,
          tp_fallback_dist_r: 4.0,
          tp_fallback_target_r: 1.5,
        },
      dof: 0,
    }
  # Σ dof = -6.  Kiểm kê gốc 26 + DG7(1) + w_tranche(1) = 28
  #   28 - 6 (đóng băng) - 4 (pool → B0) - 2 (xoá §2.4, §3.3c)
  #   - 1 (mult_dd → Cấp C) - 1 (L_BASE → mult_regime đóng băng)
  #   - 1 (zone_width, CHẾT — DR-D0PRE-01, TD-0030)  =  12  ✅ khớp tier_b
  #   → xem DR-010 để đọc bảng đối chiếu đầy đủ, xác nhận lại ở TD-0031

tier_c: # 🔒 KHOÁ — KHÔNG có ô nhập, ghi ở đây
  n_tranches: 3 # D0.4
  liq_buffer_min: 8 # §6.4b
  sl_immutable: true # D0.2
  dg6_enabled: true # bật/tắt: CẤM
  dg7_enabled: true # bật/tắt: CẤM   🆕 v6
  dg8_enabled: true # bật/tắt: CẤM
  k_swing_confirm: 3 # 🆕 v6 — CHUYỂN TỪ tier_b/frozen
  dd_ladder_pct: { soft: 5, halt: 8, abort: 20 } # 🆕 v6 — §12c.5 ✅ DR-D0PRE-04 (TD-0042), Hạng 0. halt == tier_a.daily_loss_budget_pct
  api_calls_per_min: 30 # 🆕 v7 — §6.6(3), LD-23. Điền theo nhịp
    # thật: 100 mã / 60 phút + lề. KHÔNG polling.
  entry_order_ttl_bars_1h: 3 # 🆕 v7 — §3.5, = §3.3b chờ
  corr_window_days: 30 # 🆕 v7 — §6.2 hệ số 3, định nghĩa
  # 🔴 v7 (spec): KHÔNG dùng *Parameter của Freqtrade cho BẤT KỲ khoá nào
  #        ở file này (§0d.2, L-Z37). Đọc YAML → dict → truyền vào hàm.
