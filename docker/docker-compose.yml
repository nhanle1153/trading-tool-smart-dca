# docker-compose.yml — Tool D (D0-PRE)
#
# Ba service đo/kiểm (`run --rm`, không chạy nền) + hai service VẬN HÀNH chạy nền sau
# profile `van_hanh` (dry-run D11 + watchdog, DR-TRIEN-KHAI-01 / TD-0350).
# Mount nào, vì sao — xem docker/Dockerfile và ARCHITECTURE.md mục 3.1/3.2.

x-base: &base
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment:
    - TZ=UTC
    - PYTHONHASHSEED=0
    - PYTHONPATH=/workspace/src
  working_dir: /workspace
  volumes:
    # Repo của ta -> /workspace. KHÔNG BAO GIỜ mount vào /freqtrade
    # (xem cảnh báo trong Dockerfile — đó là mã nguồn Freqtrade editable).
    - ..:/workspace
    # 🔴 lockbox/data/ (dữ liệu thị trường thật của lockbox) KHÔNG có mặt ở
    # đây — service `tests`/`freqtrade` bên dưới che nó bằng volume ẩn danh.
    # CHỈ che lockbox/data/, KHÔNG che cả lockbox/: lockbox/lockbox_seal_*.json
    # và lockbox/lockbox_access.log vẫn phải đọc được để L-Z13/L-Z14 kiểm tra
    # và để H17 verify_seal() gọi được từ đầu E1/E2/E3 (TD-0072). Đây là chỗ
    # duy nhất biến "không được chạm dữ liệu lockbox" thành "không chạm được
    # ở tầng hệ điều hành" (ARCHITECTURE.md 3.1) — không phá khả năng đọc
    # con dấu.

services:
  tests:
    <<: *base
    entrypoint: ["pytest"]
    volumes:
      - ..:/workspace
      - /workspace/lockbox/data

  freqtrade:
    <<: *base
    entrypoint: ["python"]
    volumes:
      - ..:/workspace
      - /workspace/lockbox/data

  lockbox:
    <<: *base
    entrypoint: ["python"]
    # Service DUY NHẤT thấy lockbox/data/ thật — dùng khi chạy E4
    # touch_lockbox.py ở chế độ chạm dữ liệu thật (chỉ hợp lệ sau D9).
    # (kế thừa nguyên khối ..:/workspace từ *base, không che gì ở đây)

  # ── Vận hành (TD-0350) — CHẠY NỀN, chỉ bật bằng profile ─────────────
  # `docker compose -f docker/docker-compose.yml --profile van_hanh up -d`
  # Profile giữ hai service này NGOÀI mọi lệnh `run --rm tests/freqtrade/lockbox` đang có.
  # Cả hai CHE lockbox/data/ như tests/freqtrade (ARCHITECTURE 3.1): bot vận hành không bao
  # giờ cần dữ liệu lockbox. Không thêm file nào vào entrypoints/ (L-Z36 khoá đúng 8 file) —
  # service gọi thẳng module vận hành trong src/.

  dryrun:
    <<: *base
    profiles: ["van_hanh"]
    entrypoint: ["python", "-m", "tool_d.ops.dry_run"]
    restart: unless-stopped
    # TD-0393 — bí mật Telegram nạp từ `.env.telegram` ở gốc repo (đã `.gitignore`, không commit). `required: false`:
    # thiếu file thì bot dry-run vẫn chạy, chỉ không có Telegram tích hợp (`dry_run.bien_moi_truong_telegram`).
    env_file:
      - path: ../.env.telegram
        required: false
    volumes:
      - ..:/workspace
      - /workspace/lockbox/data

  dryrun-watchdog:
    <<: *base
    profiles: ["van_hanh"]
    entrypoint: ["python", "-m", "tool_d.ops.heartbeat_watchdog", "--runmode", "dry_run"]
    restart: unless-stopped
    # Bí mật Telegram nạp từ `.env.telegram` (đã `.gitignore`, không commit) — TD-0393 thay cho việc truyền tên biến
    # qua `--env-file` mỗi lần tạo lại container (thiếu cờ đó thì container mới không có token).
    # File thiếu ⇒ watchdog dừng ngay ở `doc_thong_tin_bot()` (fail-fast), không chạy câm.
    env_file:
      - path: ../.env.telegram
        required: false
    volumes:
      - ..:/workspace
      - /workspace/lockbox/data

  # ── D10 — lệnh live TỐI THIỂU, TIỀN THẬT (TD-0384, DR-D10-02) — CHỈ bật bằng tay ─────────────
  # `docker compose -f docker/docker-compose.yml --profile d10 up -d live-d10 live-d10-watchdog risk-supervisor-d10`
  # Profile RIÊNG `d10` (không chung `van_hanh`): `up` nhầm profile dry-run không bao giờ bật tiền thật.
  # Bí mật (key tài khoản phụ, token Telegram bot RIÊNG của D10, tài khoản control API) nạp từ `.env.d10` ở gốc repo
  # (đã `.gitignore` qua `.env.*`, không commit). `required: true`: thiếu file thì KHÔNG khởi động.

  live-d10:
    <<: *base
    profiles: ["d10"]
    entrypoint: ["python", "-m", "tool_d.ops.live_d10"]
    # 🔴 KHÔNG có `restart` (DR-D10-02 Q6): máy/Docker khởi động lại ⇒ D10 DỪNG và KHÔNG tự chạy lại. Lệnh đang mở vẫn
    # có SL sống trên sàn (`stoploss_on_exchange`); watchdog bên dưới báo 🔴.
    env_file:
      - path: ../.env.d10
        required: true
    volumes:
      - ..:/workspace
      - /workspace/lockbox/data

  live-d10-watchdog:
    <<: *base
    profiles: ["d10"]
    entrypoint: ["python", "-m", "tool_d.ops.heartbeat_watchdog", "--runmode", "live"]
    # Watchdog ĐƯỢC tự chạy lại sau khi máy khởi động lại — chính nó là thứ báo "D10 đang tắt" khi bot không tự chạy lại.
    restart: unless-stopped
    env_file:
      - path: ../.env.d10
        required: true
    volumes:
      - ..:/workspace
      - /workspace/lockbox/data

  risk-supervisor-d10:
    <<: *base
    profiles: ["d10"]
    entrypoint: ["python", "-m", "tool_d.ops.risk_supervisor_daemon", "--freqtrade-api-base-url", "http://127.0.0.1:8081"]
    # Dùng CHUNG mạng với `live-d10` để `127.0.0.1:8081` (control API chỉ nghe localhost — config.risk_supervisor.json)
    # là chính bot D10. Giải TODO "topology daemon ↔ Freqtrade" của `risk_supervisor_daemon.py` (DR-D11-03).
    network_mode: "service:live-d10"
    depends_on: ["live-d10"]
    env_file:
      - path: ../.env.d10
        required: true
    volumes:
      - ..:/workspace
      - /workspace/lockbox/data
